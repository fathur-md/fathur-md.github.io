<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Sandbox</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #58a6ff;
            border-bottom: 1px solid #21262d;
            padding-bottom: 10px;
        }

        p {
            color: #8b949e;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 16px;
            border-radius: 6px;
            text-decoration: none;
            color: #c9d1d9;
            transition: 0.2s;
        }

        .card:hover {
            border-color: #58a6ff;
            background: #21262d;
        }

        .card h3 {
            margin: 0 0 4px 0;
            color: #58a6ff;
        }

        .card p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>My Web Sandbox</h1>
    <p>Pusat direktori dan indeks eksperimen coding saya.</p>

    <div class="links">
        <a href="#" class="card">
            <h3>Project Web 1</h3>
            <p>Aplikasi web pertama / deskripsi eksperimen kamu di sini.</p>
        </a>
        <a href="#" class="card">
            <h3>Project Web 2</h3>
            <p>Aplikasi web kedua / deskripsi eksperimen kamu di sini.</p>
        </a>
    </div>
</body>

</html>
